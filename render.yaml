databases:
  - name: lift-postgres
    plan: free
    databaseName: liftapp
    user: liftapp

services:
  - type: web
    name: iht-performance-app
    env: node
    nodeVersion: "20"
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run prisma:push && npm run bootstrap:owner -w server && npm run migrate:program-variant -w server && npm run backfill:lift-order -w server && npm run readiness:recompute -w server && npm run start
    healthCheckPath: /api/health
    disk:
      # Persistent volume for the program library JSON (so edits made
      # in the workouts tab survive redeploys) and uploaded exercise
      # videos. Mount path is OUTSIDE server/data/ so the git-tracked
      # seed file at server/data/programLibrary.json stays readable and
      # can be copied onto the disk on first boot.
      name: app-data
      mountPath: /var/lift-data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/lift-data
      - key: DATABASE_URL
        fromDatabase:
          name: lift-postgres
          property: connectionString
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_NAME
        value: Head Coach
      - key: OWNER_EMAIL
        value: david@ihthumanperformance.com
      - key: OWNER_PASSWORD
        sync: false
      - key: VALD_REGION
        value: use
      - key: VALD_TENANT_ID
        value: d05c0921-fc39-4d63-a706-0f69dc754103
      - key: VALD_CLIENT_ID
        sync: false
      - key: VALD_CLIENT_SECRET
        sync: false
