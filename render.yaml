databases:
  - name: lift-postgres
    plan: free
    databaseName: liftapp
    user: liftapp

services:
  - type: web
    name: iht-performance-app
    env: node
    nodeVersion: "20"
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run prisma:push && npm run bootstrap:owner -w server && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: lift-postgres
          property: connectionString
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_NAME
        value: Head Coach
      - key: OWNER_EMAIL
        value: david@ihthumanperformance.com
      - key: OWNER_PASSWORD
        sync: false
